/**
 * 给「已有 google-services.json」的 application 模块自动接入 Firebase：
 * Analytics / Crashlytics / Performance（含 perf 编译期插桩插件）。
 *
 * ---------------------------------------------------------------------------
 * Crashlytics NDK（firebase-crashlytics-ndk）使用场景
 * ---------------------------------------------------------------------------
 * - 作用：采集 C/C++、.so 等 native 崩溃，并配合符号上传还原堆栈。
 * - 体积：每个 ABI 大约多 0.8~2MB；纯 Java/Kotlin 应用一般不需要。
 * - minSdk：firebase-crashlytics-ndk 声明 minSdk 24。若 app 仍是 21，需在
 *   AndroidManifest 的 uses-sdk tools:overrideLibrary 中加入
 *   com.google.firebase.crashlytics.ndk（或把 minSdk 提到 24）。
 * - 默认关闭。开启后会：
 *   1) 增加 implementation 'firebase-crashlytics-ndk'
 *   2) 对 release 打开 nativeSymbolUploadEnabled（上传 native 符号）
 *
 * ---------------------------------------------------------------------------
 * 开关用法（优先级从高到低，解析为 true/false）
 * ---------------------------------------------------------------------------
 * 1) 命令行 / gradle.properties：
 *      ./gradlew assembleRelease -Pfirebase_ndk=true
 *      # 或在 gradle.properties 写：firebase_ndk=true
 *
 * 2) 远程 apply 的 URL query（适合把本脚本挂到 raw/CDN 后引用）：
 *      apply from: 'https://.../add_firebase.gradle?firebase_ndk=true'
 *      // 兼容简写：?ndk=true
 *
 * 3) apply 之前设置 ext：
 *      ext.firebase_ndk = true
 *      apply from: 'add_firebase.gradle'
 *
 * 4) 本文件下方默认值 FIREBASE_NDK_DEFAULT
 *
 * 本地文件 apply 不要写 ?query（会被当成文件名）；本地请用 1) / 3) / 4)。
 */

/** 脚本内默认开关；未被更高优先级覆盖时生效 */
def FIREBASE_NDK_DEFAULT = false

def parseBooleanFlag(Object value) {
    if (value == null) {
        return null
    }
    def s = value.toString().trim().toLowerCase()
    if (s in ['true', '1', 'yes', 'y', 'on']) {
        return true
    }
    if (s in ['false', '0', 'no', 'n', 'off', '']) {
        return false
    }
    return null
}

def readFirebaseNdkFromApplyUrl() {
    def result = null
    def buildFile = null
    try {
        buildFile = rootProject.buildFile
    } catch (Throwable ignored) {
    }
    if (buildFile == null || !buildFile.exists()) {
        return null
    }
    buildFile.eachLine { line ->
        // apply from: '.../add_firebase.gradle?firebase_ndk=true&...'
        def matcher = (line =~ /add_firebase\.gradle\?([^'"\s]+)/)
        if (matcher.find()) {
            matcher.group(1).split('&').each { pair ->
                def idx = pair.indexOf('=')
                if (idx <= 0) {
                    return
                }
                def key = pair.substring(0, idx).trim()
                def val = pair.substring(idx + 1).trim()
                if (key == 'firebase_ndk' || key == 'ndk') {
                    def parsed = parseBooleanFlag(val)
                    if (parsed != null) {
                        result = parsed
                    }
                }
            }
        }
    }
    return result
}

def isFirebaseNdkEnabled() {
    // 1) -P / gradle.properties
    if (rootProject.hasProperty('firebase_ndk')) {
        def parsed = parseBooleanFlag(rootProject.property('firebase_ndk'))
        if (parsed != null) {
            return parsed
        }
    }
    // 2) URL query on remote apply from
    def fromUrl = readFirebaseNdkFromApplyUrl()
    if (fromUrl != null) {
        return fromUrl
    }
    // 3) ext.firebase_ndk
    try {
        if (rootProject.ext.has('firebase_ndk')) {
            def parsed = parseBooleanFlag(rootProject.ext.firebase_ndk)
            if (parsed != null) {
                return parsed
            }
        }
    } catch (Throwable ignored) {
    }
    // 4) script default
    return FIREBASE_NDK_DEFAULT
}

def firebaseNdkEnabled = isFirebaseNdkEnabled()
println "[add_firebase] firebase_ndk=${firebaseNdkEnabled}"

rootProject.buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath 'com.google.firebase:perf-plugin:2.0.2'
    }
}

gradle.addProjectEvaluationListener(new ProjectEvaluationListener() {
    @Override
    void beforeEvaluate(Project project) {

    }

    @Override
    void afterEvaluate(Project project, ProjectState projectState) {
        if (project.plugins.findPlugin("com.android.application") == null) {
            return
        }
        if (!project.file("google-services.json").exists()) {
            println "[add_firebase] skip '${project.name}': google-services.json not found"
            return
        }
        project.apply plugin: 'com.google.gms.google-services'
        project.apply plugin: 'com.google.firebase.crashlytics'
        project.apply plugin: 'com.google.firebase.firebase-perf'
        project.dependencies {
            implementation platform('com.google.firebase:firebase-bom:35.1.0')
            implementation 'com.google.firebase:firebase-analytics'
            implementation 'com.google.firebase:firebase-crashlytics'
            implementation 'com.google.firebase:firebase-perf'
            if (firebaseNdkEnabled) {
                implementation 'com.google.firebase:firebase-crashlytics-ndk'
            }
        }
        if (firebaseNdkEnabled) {
            project.android.buildTypes.each { buildType ->
                if (buildType.name == "release") {
                    buildType.firebaseCrashlytics {
                        nativeSymbolUploadEnabled true
                    }
                }
            }
            println "[add_firebase] '${project.name}': crashlytics-ndk enabled, release nativeSymbolUploadEnabled=true"
        }
    }
})
